/* Layout: app de celular de uma coluna. Hero com a capa, cartões de ação abaixo e navegação fixa no rodapé. Visual escuro único, por escolha. */
:root{
  --bg:#050705; --panel:#0c120a; --panel2:#121a0f; --line:#22311a; --line2:#2f4520;
  --fg:#eef4e8; --dim:#c3cdb9; --mute:#9aa690;
  --neon:#a6f000; --neon2:#76c800; --ink:#071004;
  --warn:#ffb340; --bad:#ff5a4f; --ok:#a6f000;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:16.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13.5px;color:var(--neon)}
.h-display{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.sec-title h2{font-family:var(--display);font-weight:400;font-size:24px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec-title h2::before{content:"";width:5px;height:22px;background:var(--neon);transform:skewX(-14deg)}
.link{color:var(--neon);font-family:var(--cond);font-weight:700;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.muted{color:var(--dim)} .tiny{font-size:15px;color:var(--dim);line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--neon);color:var(--ink);font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;border-radius:999px;padding:13px 22px;box-shadow:0 0 26px rgba(166,240,0,.32)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--neon);border:1.5px solid var(--neon);box-shadow:none}
.btn.small{font-size:15px;padding:9px 16px}
.btn.dark{background:var(--panel2);color:var(--fg);box-shadow:none;border:1px solid var(--line2)}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:7px 12px;font-family:var(--cond);font-weight:700;font-size:14px;color:var(--fg)}
.chip.on{background:var(--neon);color:var(--ink);border-color:var(--neon)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
input,select,textarea{background:#0a0f08;border:1px solid var(--line2);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--neon);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:7px;background:#1a2414;border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--neon2),var(--neon));border-radius:9px;transition:width .4s}

/* HERO */
.hero{position:relative;min-height:440px;background:#000;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 12%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,5,.15) 0%,rgba(5,7,5,0) 30%,rgba(5,7,5,.55) 62%,var(--bg) 100%),linear-gradient(90deg,rgba(5,7,5,.55),rgba(5,7,5,0) 60%)}
.hero .top{position:absolute;z-index:3;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(5,7,5,.45);backdrop-filter:blur(6px);color:var(--neon);position:relative}
.iconbtn .dot{position:absolute;top:8px;right:9px;min-width:16px;height:16px;border-radius:9px;background:var(--neon);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.hero .copy{position:absolute;z-index:3;left:0;right:0;bottom:22px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-family:var(--display);font-weight:400;font-size:46px;line-height:.92;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.hero h1 em{font-style:normal;color:var(--neon)}
.hero .sub{font-family:var(--cond);font-weight:700;font-size:17px;color:#d8e6cc;text-transform:uppercase;letter-spacing:.04em}
.hero .sub b{color:var(--neon)}

/* quick nav */
.quick{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:12px 4px;margin-top:-6px;position:relative;z-index:4;box-shadow:0 0 0 1px rgba(166,240,0,.06),0 10px 30px rgba(0,0,0,.5)}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--fg);padding:4px 2px;border-right:1px solid var(--line)}
.quick button:last-child{border-right:0}
.quick svg{color:var(--neon)}

/* performance */
.perf{display:flex;align-items:center;gap:14px;background:radial-gradient(120% 140% at 100% 0%,rgba(166,240,0,.10),transparent 55%),var(--panel)}
.perf .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.perf h3{font-family:var(--display);font-weight:400;font-size:28px;line-height:.95;text-transform:uppercase}
.stat-line{display:flex;gap:16px;flex-wrap:wrap}
.stat-line div{display:flex;flex-direction:column}
.stat-line b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--neon)}
.stat-line small{color:var(--dim);font-size:14.5px}

/* treino cards */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.wcard{scroll-snap-align:start;flex:0 0 150px;background:linear-gradient(180deg,#0f170c,#080c07);border:1px solid var(--line2);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative}
.wcard.today{border-color:var(--neon);box-shadow:0 0 18px rgba(166,240,0,.2)}
.wcard .letter{position:absolute;top:8px;right:12px;font-family:var(--display);font-size:30px;color:rgba(166,240,0,.18)}
.wcard b{font-family:var(--display);font-weight:400;font-size:19px;text-transform:uppercase;line-height:1}
.wcard small{color:var(--dim);font-size:14.5px}
.wcard .day{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--neon);text-transform:uppercase}

/* missions */
.mission{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.mission:last-child{border-bottom:0}
.mission .ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--ink)}
.mission.done .ck{background:var(--neon);border-color:var(--neon)}
.mission .mt{flex:1;min-width:0}
.mission .mt b{font-family:var(--cond);font-weight:700;font-size:17px;text-transform:uppercase;display:block;line-height:1.1}
.mission.done .mt b{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--neon)}
.mission .xp{font-family:var(--cond);font-weight:800;color:var(--neon);font-size:15px}
.mission.done .xp{color:var(--mute)}
.lvl{display:flex;align-items:center;gap:12px}
.lvl .badge{font-family:var(--display);font-size:13px;letter-spacing:.06em;background:var(--neon);color:var(--ink);padding:3px 9px;border-radius:6px;text-transform:uppercase}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(5,7,5,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--mute);font-family:var(--cond);font-weight:700;font-size:13px;position:relative}
.nav button.on{color:var(--neon)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--neon);box-shadow:0 0 10px var(--neon)}

/* page header */
.phead{padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px}
.phead h1{font-family:var(--display);font-weight:400;font-size:38px;text-transform:uppercase;line-height:.95}

/* session */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ex.complete{border-color:var(--neon2)}
.ex .exh{display:flex;gap:12px;padding:14px 14px 10px;align-items:flex-start}
.ex .idx{font-family:var(--display);font-size:26px;color:var(--neon);line-height:1;width:26px;flex:none}
.ex .exh h3{font-family:var(--cond);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.05}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-family:var(--cond);font-weight:700;font-size:15px;border-radius:7px;padding:3px 8px;background:var(--panel2);border:1px solid var(--line2);color:var(--dim)}
.tag.n{color:var(--neon);border-color:rgba(166,240,0,.35)}
.exbody{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:0 14px 12px}
.exbody .map{background:#070a06;border:1px solid var(--line);border-radius:12px;padding:4px}
.cues{margin:0;padding-left:18px;color:#eef4e8;font-size:17px;line-height:1.45;display:flex;flex-direction:column;gap:4px}
.guide{display:inline-flex;margin-top:8px;font-family:var(--cond);font-weight:700;font-size:14px;color:var(--neon);gap:6px;align-items:center;text-decoration:none}
.sets{border-top:1px solid var(--line);padding:8px 14px 12px}
.sethead,.setrow{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center}
.sethead{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;padding:2px 0 6px}
.setrow{padding:4px 0}
.setrow .sn{font-family:var(--display);color:var(--dim);font-size:17px;text-align:center}
.setrow input{padding:9px 8px;text-align:center;font-weight:700;font-size:16px}
.setrow .ok{width:46px;height:42px;border-radius:12px;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--mute)}
.setrow.done .ok{background:var(--neon);border-color:var(--neon);color:var(--ink)}
.setrow.done input{border-color:rgba(166,240,0,.35)}
.ilus{margin:0 14px 12px;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--panel2)}
.ilus iframe{display:block;width:100%;height:min(78vh,640px);border:0;background:#fff}
.ilbtn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;padding:12px;background:var(--panel2);color:var(--neon);font-family:var(--cond);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.ilus:has(iframe) .ilbtn{border-top:1px solid var(--line2)}
.spec{display:flex;flex-direction:column;gap:9px;font-size:17px;color:#eef4e8}
.sl{display:block;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--neon);opacity:.85}
.exspec{padding:0 14px 12px}.exspec ol.cues{padding-left:18px;margin-top:4px}.stx{font-size:17px;color:#eef4e8;line-height:1.45}
.hint{margin-top:8px;font-size:16px;color:var(--dim);line-height:1.45}
.hint b{color:var(--neon)}
.up{display:flex;gap:8px;align-items:center;background:rgba(166,240,0,.1);border:1px solid rgba(166,240,0,.35);color:var(--neon);border-radius:10px;padding:7px 10px;font-family:var(--cond);font-weight:700;font-size:14.5px;margin-top:8px}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:55;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.rest .in{max-width:456px;margin:0 auto;background:var(--neon);color:var(--ink);border-radius:18px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.rest .t{font-family:var(--display);font-size:38px;line-height:1;flex:1}
.rest .t small{font-family:var(--cond);font-weight:800;font-size:13px;display:block;letter-spacing:.1em}
.rest button{background:var(--ink);color:var(--neon);border-radius:12px;padding:9px 12px;font-family:var(--cond);font-weight:800;font-size:15px}

/* food */
.food-add{display:flex;flex-wrap:wrap;gap:8px}
.fitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.fitem:last-child{border:0}
.fitem .fn{flex:1;min-width:0}
.fitem .x{color:var(--mute);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.alert{border-radius:14px;padding:13px 15px;font-size:16.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:rgba(255,179,64,.1);border:1px solid rgba(255,179,64,.4);color:#ffd9a0}
.alert.info{background:rgba(166,240,0,.07);border:1px solid rgba(166,240,0,.25);color:#d6eab8}
.alert.bad{background:rgba(255,90,79,.1);border:1px solid rgba(255,90,79,.45);color:#ffc2bd}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel2);max-width:100%}
.pgrid img{width:100%;height:100%;object-fit:cover}
.pgrid figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:var(--cond);font-weight:700;font-size:12px;text-transform:uppercase}
.compare{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:16px;overflow:hidden;background:#000;user-select:none;touch-action:none}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{clip-path:inset(0 0 0 50%)}
.compare .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--neon);box-shadow:0 0 12px var(--neon);transform:translateX(-50%)}
.compare .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--neon);color:var(--ink);display:grid;place-items:center;font-weight:900}
.compare .lab{position:absolute;top:10px;font-family:var(--display);font-size:15px;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:7px}
.compare .lab.l{left:10px}.compare .lab.r{right:10px;color:var(--neon)}

/* chart */
.chart svg{width:100%;height:auto;display:block}

.modal .sheet{background:var(--bg);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--neon);color:var(--ink);font-family:var(--cond);font-weight:800;padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.week div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 2px;font-family:var(--cond);font-weight:700;font-size:12px}
.week div b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--fg)}
.week div.today{border-color:var(--neon)}
.week div.wk-off b{color:var(--mute)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--dim)}
.seg button.on{background:var(--neon);color:var(--ink)}
.cardio-big{font-family:var(--display);font-size:64px;line-height:1;text-align:center}
.medlist div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.medlist div:last-child{border:0}
.syncpill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:rgba(5,7,5,.6);backdrop-filter:blur(6px);font-family:var(--cond);font-weight:700;font-size:13px;color:var(--dim);border:1px solid var(--line2)}
.syncpill i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.syncpill.ok i{background:var(--neon);box-shadow:0 0 8px var(--neon)}.syncpill.sync i{background:var(--warn)}.syncpill.erro i,.syncpill.offline i{background:var(--bad)}
.up.warn{background:rgba(255,179,64,.1);border-color:rgba(255,179,64,.45);color:#ffd9a0}
.rpe{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.rpe .sl{margin-right:4px}
.rpe button{border:1.5px solid var(--line2);border-radius:999px;padding:10px 15px;font-family:var(--cond);font-weight:800;font-size:17px;color:var(--dim);background:var(--panel2)}
.rpe button.on{background:var(--neon);color:var(--ink);border-color:var(--neon)}
.rpe button.on.dor{background:var(--bad);border-color:var(--bad);color:#fff}

.ilmsg{padding:16px;color:var(--dim);font-size:14px;text-align:center}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec .card b{font-family:var(--display);font-weight:400;font-size:26px;display:block;line-height:1.05}
.delta{font-family:var(--cond);font-weight:700;font-size:14px}
.delta.pos{color:var(--neon)}.delta.neg{color:var(--warn)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-family:var(--cond);font-weight:700;font-size:11px;color:var(--mute);text-align:center;letter-spacing:.06em}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:12px;color:var(--mute);background:var(--panel2);border:1px solid var(--line)}
.cal .c b{font-family:var(--display);font-weight:400;font-size:15px;line-height:1}
.cal .c.done{background:var(--neon);color:var(--ink);border-color:var(--neon)}

.cal .c.empty{background:none;border:0}
.sess{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.sess:last-child{border:0}
.sess .lt{width:42px;height:42px;border-radius:12px;background:var(--neon);color:var(--ink);font-family:var(--display);font-size:22px;display:grid;place-items:center;flex:none}
.sess .q{font-family:var(--display);font-size:20px;flex:none}
.q.good{color:var(--neon)}.q.mid{color:var(--warn)}.q.low{color:var(--bad)}
.tecbtn{border:1.5px dashed var(--line2);border-radius:999px;padding:10px 15px;font-family:var(--cond);font-weight:800;font-size:17px;color:var(--dim)}

.up{font-size:17px!important;line-height:1.4}

.mi small{display:block;color:var(--dim);font-size:15px}
.meal.done{border-color:var(--neon2)}
.exok{width:100%;margin:4px 0 12px;padding:15px;border-radius:14px;border:2px solid var(--neon);color:var(--neon);font-family:var(--display);font-size:20px;letter-spacing:.03em;background:transparent}
.exok.on{background:var(--neon);color:var(--ink)}
.wk{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:120px}

.wk b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--fg)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:16px;padding:13px 14px;background:var(--panel)}
.opt.sel{border:2px solid var(--neon)}
.opt h4{margin:0;font-family:var(--cond);font-weight:800;font-size:20px;color:var(--fg)}
.opt .m{font-family:var(--cond);font-weight:700;color:var(--neon);font-size:16px;margin-top:4px}
.opt .l{color:var(--dim);font-size:16px;margin-top:4px;line-height:1.4}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line2);color:var(--neon);font-weight:800;font-size:20px}
.qty b{min-width:62px;text-align:center}
.swaplnk{color:var(--neon);font-family:var(--cond);font-weight:800;font-size:15px;padding:0}
.swapbox{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px;margin:6px 0 10px}
.dtot{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:45;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

let memPhotos=[];
const IDB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('carlos-monstro-fotos',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('p'))db.createObjectStore('p',{keyPath:'id'});if(!db.objectStoreNames.contains('g'))db.createObjectStore('g')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 all(){return new Promise(res=>{if(!this.db)return res(memPhotos.slice());try{const q=this.db.transaction('p').objectStore('p').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res(memPhotos.slice())}catch(e){res(memPhotos.slice())}})},
 put(o){return new Promise(res=>{if(!this.db){memPhotos.push(o);return res()}try{const t=this.db.transaction('p','readwrite');t.objectStore('p').put(o);t.oncomplete=()=>res();t.onerror=()=>{memPhotos.push(o);res()}}catch(e){memPhotos.push(o);res()}})},
 del(id){return new Promise(res=>{memPhotos=memPhotos.filter(p=>p.id!==id);if(!this.db)return res();try{const t=this.db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})},
 getG(){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('g').objectStore('g').get('pdf');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 putG(buf){return new Promise(res=>{if(!this.db)return res();try{const t=this.db.transaction('g','readwrite');t.objectStore('g').put(buf,'pdf');t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}

/* ===================== DATAS ===================== */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>key(new Date());
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmt=k=>{const d=parse(k);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const fmtLong=k=>{const d=parse(k);return DOW[d.getDay()]+' '+fmt(k)};
const mondayOf=k=>{const d=parse(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return key(d)};
function age(){const b=new Date(1984,0,3),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),0,3))a--;return a}

/* ===================== METAS ===================== */
function weekNum(k=today()){if(!S.profile)return 1;return Math.max(1,Math.floor(diffDays(S.profile.start,k)/7)+1)}
function cardioTarget(k=today()){const w=weekNum(k);const ov=S.profile&&S.profile.metaCardio;const base=ov?ov:(w<=2?20:w<=4?30:w<=6?35:40);const dow=parse(k).getDay();if(dow===0)return 0;if(dow===3)return base+10;return base}
function fichaInfo(k=today()){const start=(S.profile&&(S.profile.fichaStart||S.profile.start))||k;const w=Math.max(1,Math.floor(diffDays(start,k)/7)+1);
 const n=(S.profile&&S.profile.fichaNum)||1;const sem=Math.min(w,FICHA_SEMANAS);const fim=addDays(start,FICHA_SEMANAS*7-1);
 const fase=w<=1?'Adaptação':w<FICHA_SEMANAS?'Progressão':w===FICHA_SEMANAS?'Semana leve (deload)':'Hora de trocar a ficha';
 return{n,w,sem,fim,fase,deload:w===FICHA_SEMANAS,vencida:w>FICHA_SEMANAS,start}}
function setsFor(e){const ex=EX[e];return fichaInfo().deload?Math.max(2,ex.s-1):ex.s}
function stepsTarget(k=today()){const w=weekNum(k);return w<=2?7000:w<=4?8000:10000}
function currentWeight(){const m=S.measures.filter(x=>x.peso).sort((a,b)=>a.d<b.d?-1:1);return m.length?m[m.length-1].peso:(S.profile?S.profile.peso:null)}
function currentWaist(){const m=S.measures.filter(x=>x.cintura).sort((a,b)=>a.d<b.d?-1:1);return m.length?m[m.length-1].cintura:(S.profile?S.profile.cintura:null)}
function targets(){
 const p=S.profile;if(!p)return{kcal:0,prot:0,agua:0};
 const w=currentWeight(),h=p.altura,a=age();
 const bmr=10*w+6.25*h-5*a+5;const tdee=bmr*1.45;
 let kcal=Math.round(tdee*0.78/50)*50;kcal=Math.max(1800,Math.min(kcal,2600));
 const ref=25*Math.pow(h/100,2);
 let prot=Math.round(2.2*ref/5)*5;prot=Math.max(140,Math.min(prot,220));
 let agua=Math.round(Math.min(3500,Math.max(2500,w*30))/250)*250;
 const auto={kcal,prot,agua};
 if(p.metaKcal)kcal=p.metaKcal;if(p.metaProt)prot=p.metaProt;if(p.metaAgua)agua=p.metaAgua;
 return{kcal,prot,agua,tdee:Math.round(tdee),auto};
}
function day(k=today()){if(!S.days[k])S.days[k]={agua:0,passos:0,cardio:0,foods:[],treino:null};return S.days[k]}
function dayTotals(k){const d=S.days[k];if(!d)return{kcal:0,prot:0};return d.foods.reduce((a,f)=>({kcal:a.kcal+f.k,prot:a.prot+f.p}),{kcal:0,prot:0})}
function medDue(k){return S.profile&&parse(k).getDay()===S.profile.medDia}
function photoDay(k){return parse(k).getDay()===1}

/* ===================== MISSÕES / XP ===================== */
function missions(k=today()){
 const d=S.days[k]||{agua:0,passos:0,cardio:0,foods:[],treino:null};const t=targets();const tot=dayTotals(k);const dow=parse(k).getDay();const w=SCHEDULE[dow];
 const list=[];
 if(w&&w!=='E')list.push({id:'treino',t:'Treino '+w+' · '+WORKOUTS[w].nome,s:'Musculação de manhã · '+(S.profile?S.profile.hora:''),done:d.treino===w,xp:XP.treino,go:()=>startWorkout(w)});
 if(w==='E')list.push({id:'treino',t:'Treino E · Core (opcional)',s:'Abdômen e lombar',done:d.treino==='E',xp:XP.treino,go:()=>startWorkout('E')});
 const ct=cardioTarget(k);
 if(ct>0)list.push({id:'cardio',t:(dow===3?'Caminhada ':'Cardio ')+ct+' min',s:dow===3?'Descanso ativo: ritmo de conversa':'Logo depois da musculação, ritmo moderado',done:d.cardio>=ct,xp:XP.cardio,go:()=>go('cardio')});
 list.push({id:'proteina',t:'Proteína '+t.prot+' g',s:Math.round(tot.prot)+' g até agora',done:tot.prot>=t.prot,xp:XP.proteina,go:()=>go('comida')});
 list.push({id:'agua',t:'Água '+(t.agua/1000).toFixed(1).replace('.',',')+' L',s:(d.agua/1000).toFixed(2).replace('.',',')+' L até agora',done:d.agua>=t.agua,xp:XP.agua,go:()=>go('comida')});
 list.push({id:'passos',t:stepsTarget(k).toLocaleString('pt-BR')+' passos',s:'Veja no app de saúde do celular e anote',done:d.passos>=stepsTarget(k),xp:XP.passos,go:()=>openSteps(k)});
 if(photoDay(k))list.push({id:'foto',t:'Fotos + peso + cintura',s:'Segunda é dia de registrar a evolução',done:hasWeekly(k),xp:XP.foto,go:()=>go('evolucao')});
 if(medDue(k))list.push({id:'med',t:'Aplicação da semana',s:(S.profile.dose||'')+' · '+nextSite(),done:S.meds.some(m=>m.d===k),xp:XP.med,go:()=>openMed()});
 return list;
}
let photoDates=new Set();
function hasWeekly(k){return S.measures.some(m=>m.d===k)&&photoDates.has(k)}
function totalXP(){let x=0;Object.keys(S.days).forEach(k=>{if(k>today())return;missions(k).forEach(m=>{if(m.done)x+=m.xp})});
 S.meds.forEach(m=>{if(!S.days[m.d])x+=XP.med});return x}
function level(x){let i=0;LEVELS.forEach((l,j)=>{if(x>=l[1])i=j});const cur=LEVELS[i],nxt=LEVELS[i+1];return{n:i+1,name:cur[0],from:cur[1],to:nxt?nxt[1]:cur[1],next:nxt?nxt[0]:null}}
function weekConsistency(){const mon=mondayOf(today());let done=0,all=0;for(let k=mon;k<=today();k=addDays(k,1)){if(S.profile&&k<S.profile.start)continue;missions(k).forEach(m=>{all++;if(m.done)done++})}return all?Math.round(done/all*100):0}
function streak(){let n=0;let k=today();const ok=k=>{const m=missions(k);return m.filter(x=>x.done).length>=Math.ceil(m.length*0.6)};if(!ok(k))k=addDays(k,-1);while(S.profile&&k>=S.profile.start&&ok(k)){n++;k=addDays(k,-1)}return n}

/* ===================== MEDICAÇÃO ===================== */
function nextSite(){const last=S.meds.slice().sort((a,b)=>a.d<b.d?-1:1).pop();if(!last)return SITES[0];const i=SITES.indexOf(last.local);return SITES[(i+1)%SITES.length]}
function nextMedDate(){if(!S.profile)return null;let k=today();for(let i=0;i<8;i++){const kk=addDays(k,i);if(parse(kk).getDay()===S.profile.medDia&&!S.meds.some(m=>m.d===kk))return kk}return null}

/* ===================== MAPA MUSCULAR (desenho próprio) ===================== */
function bodyMap(hl,h){const on=id=>hl.includes(id);const f=(id)=>on(id)?'var(--neon)':'#1d2818';const st=(id)=>on(id)?'#d8ff7a':'#2b3a22';
 const E=(id,cx,cy,rx,ry,r)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f(id)}" stroke="${st(id)}" stroke-width=".8"${r?` transform="rotate(${r} ${cx} ${cy})"`:''}/>`;
 const R=(id,x,y,w,hh,rr)=>`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="${rr}" fill="${f(id)}" stroke="${st(id)}" stroke-width=".8"/>`;
 const base='#141c11';
 const fig=(cx)=>`<circle cx="${cx}" cy="13" r="8.5" fill="${base}"/><rect x="${cx-4}" y="20" width="8" height="7" fill="${base}"/><path d="M${cx-17} 30 Q${cx} 25 ${cx+17} 30 L${cx+14} 92 Q${cx} 98 ${cx-14} 92Z" fill="${base}"/><rect x="${cx-15}" y="92" width="13" height="80" rx="6" fill="${base}"/><rect x="${cx+2}" y="92" width="13" height="80" rx="6" fill="${base}"/>`;
 const front=fig(40)+E('trapezio',40,29,10,3)+E('ombro',23,37,7,6,-20)+E('ombro',57,37,7,6,20)+E('peito',33,44,8,6.5)+E('peito',47,44,8,6.5)+E('biceps',18,56,4.5,10,10)+E('biceps',62,56,4.5,10,-10)+E('antebraco',15,79,4,11,8)+E('antebraco',65,79,4,11,-8)+R('abdomen',34,53,12,32,4)+E('obliquos',29,69,3.5,11)+E('obliquos',51,69,3.5,11)+E('quadriceps',33,118,7,21)+E('quadriceps',47,118,7,21)+E('panturrilha',33,154,4.5,11)+E('panturrilha',47,154,4.5,11);
 const back=fig(120)+E('trapezio',120,33,13,7)+E('ombro',103,37,7,6,-20)+E('ombro',137,37,7,6,20)+E('dorsal',111,56,8.5,14,8)+E('dorsal',129,56,8.5,14,-8)+E('triceps',98,56,4.5,10,10)+E('triceps',142,56,4.5,10,-10)+E('antebraco',95,79,4,11,8)+E('antebraco',145,79,4,11,-8)+R('lombar',114,70,12,14,4)+E('gluteos',113,97,7.5,8)+E('gluteos',127,97,7.5,8)+E('posterior',113,124,6.5,18)+E('posterior',127,124,6.5,18)+E('panturrilha',113,155,5.5,12)+E('panturrilha',127,155,5.5,12);
 return `<svg viewBox="0 0 160 182" ${h?`height="${h}"`:'width="100%"'} role="img" aria-label="Músculos trabalhados">${front}${back}<text x="40" y="180" text-anchor="middle" font-size="7" fill="#5f6d57" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700">FRENTE</text><text x="120" y="180" text-anchor="middle" font-size="7" fill="#5f6d57" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700">COSTAS</text></svg>`}
function workoutMuscles(w){const s=new Set();WORKOUTS[w].ex.forEach(e=>EX[e].m.forEach(m=>s.add(m)));return[...s]}
function workoutMinutes(w){return Math.round(WORKOUTS[w].ex.reduce((a,e)=>a+EX[e].s*(45+EX[e].rest),0)/60/5)*5}

function medNudge(){const y=addDays(today(),-1);const t=targets();const tt=dayTotals(y);const yd=S.days[y];

function lastLog(exId){const l=(S.logs[exId]||[]);return l.length?l[l.length-1]:null}
function startWorkout(w){const k=today();if(S.session&&S.session.w===w&&S.session.d===k){go('sessao');return}
 S.session={w,d:k,sets:{},sug:{},ini:Date.now(),tec:{}};WORKOUTS[w].ex.forEach(e=>{const ex=EX[e];const last=lastLog(e);const sg=!last&&SUG[e];if(sg)S.session.sug[e]=1;S.session.sets[e]=Array.from({length:setsFor(e)},(_,i)=>({kg:last&&last.nextKg!=null?String(last.nextKg):last&&last.sets[i]?last.sets[i].kg:(last&&last.sets.length?last.sets[last.sets.length-1].kg:(sg?String(SUG[e][0]):'')),r:'',done:false}))});save();go('sessao')}
function suggestion(e){const ex=EX[e],last=lastLog(e);if(!last||ex.unit)return '';
 const nl=nextLoad(e,last.sets,last.rpe);if(nl)return `<div class="nextkg">${nl.dir==='up'?'▲':nl.dir==='down'?'▼':'●'} Hoje: ${nl.kg} kg ${SUG[e]?SUG[e][1]:''} <span class="tiny" style="font-family:var(--body);font-weight:400">(${nl.why} no último treino)</span></div>`;
 if(last.rpe==='Dor')return `<div class="up warn">⚠ Na última vez você marcou DOR. Mantenha ou reduza a carga. Se a dor continuar, troque o exercício e procure um profissional.</div>`;
 const top=ex.r[1];const allTop=last.sets.length>=ex.s&&last.sets.every(s=>Number(s.r)>=top);
 if(allTop&&last.rpe!=='Difícil')return `<div class="up">▲ Última vez: ${top} reps em todas as séries${last.rpe?' com esforço '+last.rpe.toLowerCase():''}. Se a técnica estiver perfeita, suba o MENOR passo do equipamento (halter: +1 a 2 kg · máquina: +2,5 a 5 kg).</div>`;
 if(allTop)return `<div class="hint">Você bateu ${top} reps em todas, mas marcou esforço difícil. Repita a carga até ficar moderado.</div>`;
 return ''}
function sessaoHTML(){const s=S.session;if(!s)return treinosHTML();const W=WORKOUTS[s.w];const total=W.ex.reduce((a,e)=>a+s.sets[e].length,0),done=W.ex.reduce((a,e)=>a+s.sets[e].filter(x=>x.done).length,0);
 return `<div class="view pad"><div class="phead"><div class="between"><div class="eyebrow">${fmtLong(s.d)} · treino ${s.w}</div><button class="link" data-act="quit">Sair</button></div><h1>${W.nome}</h1><div class="muted">${W.foco}</div></div>

  S._delPhotos=S._delPhotos.filter(x=>x!==rid)}
 const all=await IDB.all();
 for(const p of all){if(p.up)continue;try{if(!p.rid)p.rid=uuid();const path=user.id+'/'+p.rid+'.jpg';
  const blob=await (await fetch(p.src)).blob();
  const up=await sb.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;
  const r=await sb.from('fotos').upsert({id:p.rid,user_id:user.id,dia:p.d,pose:p.pose,caminho:path,deleted:false});if(r.error)throw r.error;
  p.up=1;delete p.err;await IDB.put(p);st.up++;st.fotosUp=(st.fotosUp||0)+1}catch(err){p.err=String(err&&err.message||err);await IDB.put(p);st.fotoErr=(st.fotoErr||0)+1}}
 const q=await sb.from('fotos').select('id,dia,pose,caminho,deleted');if(q.error)throw q.error;
 const have=new Map(all.filter(p=>p.rid).map(p=>[p.rid,p]));
 for(const row of q.data){const L=have.get(row.id);
  if(row.deleted){if(L){await IDB.del(L.id);st.down++}continue}
  if(!L){const dl=await sb.storage.from('fotos').download(row.caminho);if(dl.error)continue;const src=await blobToDataURL(dl.data);await IDB.put({id:row.id,rid:row.id,d:row.dia,pose:row.pose,src,up:1});st.down++;st.fotosDown=(st.fotosDown||0)+1}}
 photoDates=new Set((await IDB.all()).map(p=>p.d))}

async function syncNow(){
 if(!sb||!user)return null;if(syncing)return null;
 if(!navigator.onLine){setSync('offline');return null}
 syncing=true;setSync('sync');const st={up:0,down:0,byTable:{}};
 try{
  S._sync=S._sync||{};
  const tables=['perfil','dias','treinos','medidas','aplicacoes'];
  const res=await Promise.all(tables.map(t=>sb.from(t).select('*')));
  res.forEach(r=>{if(r.error)throw r.error});
  const rs=await sb.from('sessoes').select('*');
  if(rs.error){S._noSess=true}else{S._noSess=false;tables.push('sessoes');res.push(rs)}
  let local=localRecords();const applied=[];
  tables.forEach((t,i)=>res[i].data.forEach(row=>{const [key,val,del]=fromRow(t,row);const L=local[key];
   const dirty=!!L&&stable(L.v)!==S._sync[key];
   if(del){if(L&&!dirty){removeLocal(key);delete S._sync[key];st.down++}else if(!L)delete S._sync[key];return}
   if(!L){if(S._sync[key])return;setLocal(key,val);applied.push(key);st.down++;return}
   if(!dirty&&stable(L.v)!==stable(val)){setLocal(key,val);applied.push(key);st.down++}
   else if(!dirty)S._sync[key]=stable(L.v)}));
  local=localRecords();
  applied.forEach(k=>{if(local[k])S._sync[k]=stable(local[k].v)});
  const ups={};
  for(const k in local){if(local[k].t==='sessoes'&&S._noSess)continue;if(stable(local[k].v)!==S._sync[k])(ups[local[k].t]=ups[local[k].t]||[]).push(k)}
  for(const t in ups){const rows=ups[t].map(k=>Object.assign(toRow(local[k]),{user_id:user.id}));
   const r=await sb.from(t).upsert(rows,{onConflict:CONFLICT[t]});if(r.error)throw r.error;
   ups[t].forEach(k=>{S._sync[k]=stable(local[k].v)});st.up+=rows.length;st.byTable[t]=rows.length}
  for(const k of Object.keys(S._sync).filter(k=>!local[k])){await pushDelete(k);delete S._sync[k];st.up++}
  await syncPhotos(st);
  if(!S._guideUp){try{const g=await IDB.getG();if(g){const up=await sb.storage.from('guia').upload(user.id+'/guia.pdf',new Blob([g],{type:'application/pdf'}),{contentType:'application/pdf',upsert:true});if(!up.error)S._guideUp=true}}catch(e){}}
  S._lastSync=Date.now();saveRaw();setSync('ok');
  if(st.down&&!document.querySelector('#modal:not([hidden])')&&view!=='sessao'){const sc=window.scrollY;render();window.scrollTo(0,sc)}
  return st;
 }catch(e){console.warn('sync',e);setSync('erro',(e&&e.message)||'');return null}
 finally{syncing=false}}

var forcaEx=null;
function sessStats(l){const sets=(l.sets||[]).map(s=>({kg:num(s.kg)||0,r:num(s.r)||0}));const top=sets.length?Math.max(...sets.map(s=>s.kg)):0;
 return{top,vol:Math.round(sets.reduce((a,s)=>a+s.kg*s.r,0)),repsTop:sets.filter(s=>s.kg===top).reduce((a,s)=>Math.max(a,s.r),0),reps:sets.reduce((a,s)=>a+s.r,0),n:sets.length}}
function forcaHTML(){const exs=Object.keys(EX).filter(e=>!EX[e].unit&&(S.logs[e]||[]).length);

 const maxTop=ss.reduce((a,s)=>s.top>a.top||(s.top===a.top&&s.repsTop>a.repsTop)?s:a,ss[0]);

function fv(f,g){const d=DF[f];return{k:d[1]*g/100,p:d[2]*g/100,c:d[3]*g/100,gd:d[4]*g/100}}
function sumIt(items){return items.reduce((a,x)=>{const v=fv(x.f,x.g);return{k:a.k+v.k,p:a.p+v.p}},{k:0,p:0})}
function mealTarget(id){const t=targets();return{k:Math.round(t.kcal*ML[id].k),p:Math.round(t.prot*ML[id].p)}}
function roundG(f,g,role){const u=DF[f][5];if(f==='ovo'||f==='clara')return Math.max(u,Math.round(g/u)*u);if(f==='whey')return Math.max(15,Math.round(g/5)*5);if(role==='x')return g;return Math.max(5,Math.round(g/5)*5)}
function solveOpt(id,o){const tg=mealTarget(id);let items=o.it.map(([f,role,base])=>({f,role,g:base}));
 if(!items.some(x=>x.role!=='x'))return items.map(x=>({f:x.f,g:x.g}));
 let k=1;for(let i=0;i<6;i++){items.forEach(x=>{if(x.role==='c'){const b=o.it.find(z=>z[0]===x.f&&z[1]==='c')[2];x.g=b*k}});
  const pIt=items.filter(x=>x.role==='p');const pOther=items.filter(x=>x.role!=='p').reduce((a,x)=>a+fv(x.f,x.g).p,0);
  pIt.forEach(x=>{x.g=Math.max(0,(tg.p-pOther)/pIt.length/(DF[x.f][2]/100))});
  const cK=items.filter(x=>x.role==='c').reduce((a,x)=>a+fv(x.f,x.g).k,0);const oK=items.filter(x=>x.role!=='c').reduce((a,x)=>a+fv(x.f,x.g).k,0);
  if(!cK)break;k=Math.max(.3,Math.min(3,k*((tg.k-oK)/cK)))}
 return items.map(x=>({f:x.f,g:roundG(x.f,x.g,x.role)}))}
function currentMeal(id){const c=(S.dietCustom||{})[id];if(c&&c.items&&c.items.length)return{name:c.name,items:c.items,custom:true};const o=ML[id].opts[0];return{name:o.n,items:solveOpt(id,o),custom:false}}
function household(f,g){const d=DF[f];if(f==='cafe')return '1 xícara';const r=Math.max(.5,Math.round(g/d[5]*2)/2);if(r===.5)return '≈ meia '+d[6];const s=String(r).replace('.',',');return '≈ '+s+' '+(r>1?(PLU[d[6]]||d[6]):d[6])}

 html+=`<div class="alert info">⚖️<div>Pesos de alimento <b>já pronto</b> (cozido ou grelhado). Na 1ª semana, pese numa balança de cozinha pra calibrar o olho. Valores médios da tabela TACO: são uma boa referência, não substituem nutricionista, ainda mais usando tirzepatida.</div></div>`;
 return html}

function ajusteHTML(){if(!dietEdit)return dietHTML();const id=dietEdit.meal;const m=ML[id];const tg=mealTarget(id);const s=sumIt(dietEdit.items);
 const dk=Math.round(s.k-tg.k),dp=Math.round(s.p-tg.p);const ok=Math.abs(dk)<=Math.max(40,tg.k*.08)&&(tg.p===0||s.p>=tg.p*0.9);
 return `<div class="view pad" style="padding-bottom:150px"><div class="phead"><div class="between"><div class="eyebrow">${m.nome} · ${esc(dietEdit.name)}</div><button class="link" data-lib="${id}">← Opções</button></div><h1>Ajustar refeição</h1></div>

 <div class="card"><div class="eyebrow">Meta desta refeição</div><div style="font-size:16.5px;margin-top:4px">${tg.k} kcal${tg.p?' · '+tg.p+' g de proteína':''}</div></div>
 <div class="dtot"><div class="in"><div class="between"><b class="h-display num" style="font-size:22px">${Math.round(s.k)} kcal · ${Math.round(s.p)} g prot</b><span class="tag ${ok?'n':''}" style="${ok?'':'color:#ffb340;border-color:#ffb340'}">${ok?'✓ dentro da meta':(dk>0?'+':'')+dk+' kcal'+(tg.p&&dp<0?' · '+dp+' g prot':'')}</span></div>

function swapHTML(x){const grp=DF[x.f][7];if(!grp||grp==='Z')return '';const base=fv(x.f,x.g);
 const cands=Object.keys(DF).filter(f=>f!==x.f&&DF[f][7]===grp&&!dietEdit.items.some(z=>z.f===f)).slice(0,8).map(f=>{const g=grp==='P'?base.p/(DF[f][2]/100):base.k/(DF[f][1]/100);return{f,g:roundG(f,g,'c')}}).filter(c=>c.g>0&&isFinite(c.g));
 return `<div class="swapbox"><div class="eyebrow">Trocar ${esc(DF[x.f][0].toLowerCase())} por</div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">${cands.map(c=>`<button class="chip" data-swapto="${x.f}|${c.f}|${c.g}">${esc(DF[c.f][0])} ${c.g} g</button>`).join('')}</div><div class="tiny" style="margin-top:6px">${grp==='P'?'Mesma quantidade de proteína.':'Mesmas calorias.'}</div></div>`}
function stepFor(f,g){const u=DF[f][5];if(f==='ovo'||f==='clara')return u;if(f==='whey')return 5;return g<60?5:10}
function eatMeal(id){const d=day();if(eatenMeal(id)){d.foods=d.foods.filter(f=>f.meal!==id);save();toast('REFEIÇÃO REMOVIDA');return}

/* ===================== ESFORÇO → CARGA ===================== */
const r5=(x,st)=>Math.max(0,Math.round(x/st)*st);
function applyRpe(e){const s=S.session;if(!s||EX[e].unit||!SUG[e]||!SUG[e][0])return;s.baseKg=s.baseKg||{};const sets=s.sets[e];
 if(!s.baseKg[e])s.baseKg[e]=sets.map(x=>x.kg);const st=stepOf(e),r=(s.rpe||{})[e];
 sets.forEach((x,i)=>{if(x.done)return;const b=num(s.baseKg[e][i]);if(b==null){return}
  x.kg=String(r==='Fácil'?b+st:r==='Dor'?r5(b*0.8,st):b)})}
function topKg(sets){return sets.reduce((a,x)=>Math.max(a,num(x.kg)||0),0)}
function nextLoad(e,sets,rpe){const ex=EX[e];if(ex.unit||!sets.length)return null;const st=stepOf(e),top=topKg(sets);if(!top)return null;
 const allTop=sets.length>=ex.s&&sets.every(x=>(num(x.r)||0)>=ex.r[1]);const below=sets.some(x=>(num(x.r)||0)<ex.r[0]);
 if(rpe==='Dor')return{kg:r5(top*0.8,st),why:'você marcou dor',dir:'down'};
 if(rpe==='Fácil')return{kg:top+st,why:'esforço fácil',dir:'up'};
 if(rpe==='Difícil')return below?{kg:Math.max(0,top-st),why:'não completou as repetições',dir:'down'}:{kg:top,why:'esforço difícil: repete até ficar moderado',dir:'keep'};
 if(allTop)return{kg:top+st,why:'bateu '+ex.r[1]+' repetições em todas',dir:'up'};
 return{kg:top,why:rpe==='Moderado'?'carga certa':'mantém até bater '+ex.r[1]+' reps em todas',dir:'keep'}}
function rpeToast(e){const r=S.session.rpe[e],st=stepOf(e);return r==='Fácil'?'CARGA +'+st+' KG NAS PRÓXIMAS SÉRIES':r==='Dor'?'CARGA REDUZIDA 20%':'CARGA MANTIDA'}
function rpeMsg(e){const s=S.session;const r=(s.rpe||{})[e];if(!r)return `<div class="hint">Marque o esforço depois da 1ª série. O app ajusta a carga das próximas séries e do próximo treino.</div>`;
 const st=stepOf(e),u=SUG[e]?SUG[e][1]:'';const sets=s.sets[e];const nxt=sets.find(x=>!x.done);const cur=nxt?nxt.kg:topKg(sets);
 if(EX[e].unit||!SUG[e]||!SUG[e][0])return `<div class="rpemsg keep">${r==='Fácil'?'▲ Fácil: aumente o tempo em 5 a 10 segundos na próxima série.':r==='Dor'?'▼ Dor: pare este exercício hoje e troque por outro do core.':'● Registrado. Mantenha o tempo.'}</div>`;
 if(r==='Fácil')return `<div class="rpemsg up2">▲ FÁCIL: subimos <b>+${st} kg</b>. Próximas séries com <b>${cur} kg</b> ${u}.</div>`;
 if(r==='Moderado')return `<div class="rpemsg keep">● MODERADO: carga certa. Continue com <b>${cur} kg</b>. Quando bater ${EX[e].r[1]} reps em todas as séries, o app sobe +${st} kg no próximo treino.</div>`;
 if(r==='Difícil')return `<div class="rpemsg keep">● DIFÍCIL: mantenha <b>${cur} kg</b> e capriche na técnica. Se não completar ${EX[e].r[0]} reps, o próximo treino desce ${st} kg.</div>`;
 return `<div class="rpemsg down">▼ DOR: reduzimos para <b>${cur} kg</b>. Se a dor continuar, pare este exercício hoje. Dor que não passa: procure um profissional.</div>`}

var histMonth=null;
function buildSessionSummary(s){const W=WORKOUTS[s.w];let setsDone=0,setsPlan=0,repsOk=0,vol=0,dor=false;const exs=[];
 W.ex.forEach(e=>{const ex=EX[e];const st=s.sets[e]||[];const done=st.filter(x=>x.done||x.r);setsPlan+=st.length;setsDone+=done.length;
  let ok=0;done.forEach(x=>{const r=num(x.r)||0;if(r>=ex.r[0])ok++;vol+=(num(x.kg)||0)*r});repsOk+=ok;

 if(ds.fx){forcaEx=ds.fx;render();return}
 if(ds.lib){libMeal=ds.lib;libTag='todas';libQ='';swapOpen=null;go('biblio');return}
 if(ds.ltag){libTag=ds.ltag;render();return}
 if(ds.pick){const[m,i]=ds.pick.split('|');const o=ML[m].opts[+i];dietEdit={meal:m,name:o.n,items:solveOpt(m,o).map(x=>({...x}))};swapOpen=null;go('ajuste');return}
 if(ds.editcur){const c=currentMeal(ds.editcur);dietEdit={meal:ds.editcur,name:c.name,items:c.items.map(x=>({...x}))};swapOpen=null;go('ajuste');return}
 if(ds.reset){S.dietCustom=S.dietCustom||{};delete S.dietCustom[ds.reset];save();toast('VOLTOU PARA A OPÇÃO PADRÃO');render();return}
 if(ds.qty){const[f,dir]=ds.qty.split('|');const it=dietEdit.items.find(x=>x.f===f);if(it&&f!=='cafe'){it.g=Math.max(0,it.g+(+dir)*stepFor(f,it.g));if(it.g===0)dietEdit.items=dietEdit.items.filter(x=>x!==it)}const sc=window.scrollY;render();window.scrollTo(0,sc);return}
 if(ds.swap){swapOpen=swapOpen===ds.swap?null:ds.swap;const sc=window.scrollY;render();window.scrollTo(0,sc);return}
 if(ds.swapto){const[from,to,g]=ds.swapto.split('|');const it=dietEdit.items.find(x=>x.f===from);if(it){it.f=to;it.g=+g}swapOpen=null;dietEdit.name=dietEdit.name.replace(/ \(ajustado\)$/,'')+' (ajustado)';const sc=window.scrollY;render();window.scrollTo(0,sc);return}
 if(ds.deat){eatMeal(ds.deat);const sc=window.scrollY;render();window.scrollTo(0,sc);return}
 if(ds.tec){S.session.tec=S.session.tec||{};S.session.tec[ds.tec]=!S.session.tec[ds.tec];saveRaw();const sc=window.scrollY;render();window.scrollTo(0,sc);return}
 if(ds.sess){showSessionSummary(ds.sess,false);return}
 if(ds.hm){histMonth=ds.hm;render();return}
 if(ds.agua){const d=day();d.agua=Math.max(0,d.agua+ +ds.agua);save();render();return}
 if(ds.food){const f=FOODS[+ds.food];day().foods.push({n:f[0],k:f[1],p:f[2]});save();const sc=window.scrollY;render();window.scrollTo(0,sc);toast('+'+f[2]+' g PROTEÍNA');return}
 if(ds.fdel){day().foods.splice(+ds.fdel,1);save();render();return}
 if(ds.cadd){day().cardio+= +ds.cadd;save();render();toast('+'+ds.cadd+' MIN DE CARDIO');return}
 if(ds.ctype){S.cardioType=+ds.ctype;save();render();return}
 if(ds.pose){cmp={pose:ds.pose,a:null,b:null};render();return}
 if(ds.pdel){const box=t.closest('figure');if(box.dataset.confirm){const all=await IDB.all();const ph=all.find(p=>p.id===ds.pdel);if(ph&&ph.rid&&ph.up){S._delPhotos=(S._delPhotos||[]).concat(ph.rid)}await IDB.del(ds.pdel);save();fillPhotos()}else{box.dataset.confirm=1;t.style.background='var(--bad)';toast('TOQUE DE NOVO PARA APAGAR')}return}
 if(ds.sv!=null){const seg=t.parentElement;seg.dataset.val=ds.sv;seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
 switch(ds.act){
  case 'start':startWorkout(ds.w);break;
  case 'login':loginModal();break;
  case 'dietSave':{S.dietCustom=S.dietCustom||{};S.dietCustom[dietEdit.meal]={name:dietEdit.name,items:dietEdit.items.map(x=>({f:x.f,g:x.g}))};save();toast('SALVO NO SEU CARDÁPIO');dietEdit=null;go('comida');break}
  case 'lixoOn':{if(t.dataset.confirm){S.lixo=(S.lixo||[]).filter(d=>d!==today()).concat(today());save();render();toast('DIA DO LIXO ATIVADO')}else{t.dataset.confirm=1;t.textContent='Toque de novo para confirmar'}break}
  case 'lixoOff':{S.lixo=(S.lixo||[]).filter(d=>d!==today());save();render();toast('DIA DO LIXO CANCELADO');break}
  case 'noteSave':{const k=ds.k;if(S.sessions[k]){S.sessions[k].nota=$('#snote').value.trim();save()}closeModal();if(ds.next==='cardio')go('cardio');else render();break}
  case 'guideRetry':{pdfDoc=null;Object.keys(guideCache).forEach(x=>delete guideCache[x]);render();break}
  case 'novaFicha':{if(t.dataset.confirm){S.profile.fichaNum=(S.profile.fichaNum||1)+1;S.profile.fichaStart=today();save();render();toast('FICHA '+S.profile.fichaNum+' INICIADA')}else{t.dataset.confirm=1;t.textContent='Toque de novo para confirmar'}break}
  case 'icsAll':downloadICS();break;
  case 'notifOn':enableNotif();break;
  case 'loginGo':doLogin();break;
  case 'logout':{if(t.dataset.confirm){await sb.auth.signOut();user=null;setSync('local');render();toast('VOCÊ SAIU DA CONTA')}else{t.dataset.confirm=1;t.textContent='Toque de novo para sair';}break}
  case 'syncNow':{const st=await syncNow();if(st)toast('SINCRONIZADO · ↑'+st.up+' ↓'+st.down);break}
  case 'install':{if(deferredInstall){deferredInstall.prompt();deferredInstall=null}break}
  case 'missoes':if(view!=='home')go('home');setTimeout(()=>{const m=$('#missoes');m&&m.scrollIntoView({behavior:'smooth',block:'center'})},60);break;
  case 'med':medModal();break;
  case 'quit':stopRest();go('treinos');break;
  case 'finish':finishWorkout();break;
  case 'rest15':restEnd+=15000;tickRest();break;
  case 'restskip':stopRest();break;
  case 'cstart':cardioRun={start:Date.now()};render();clearInterval(cardioTick);cardioTick=setInterval(()=>{const el=$('#cardioClock');if(!el||!cardioRun)return;const s=Math.floor((Date.now()-cardioRun.start)/1000);el.textContent=Math.floor(s/60)+':'+pad(s%60);if(s===cardioTarget()*60-day().cardio*60&&s>0){beep();toast('META DE CARDIO BATIDA!')}},1000);break;
  case 'cstop':{const m=Math.round((Date.now()-cardioRun.start)/60000);cardioRun=null;clearInterval(cardioTick);if(m>0){day().cardio+=m;save()}render();toast(m>0?'+'+m+' MIN SALVOS':'MENOS DE 1 MIN, NÃO SALVO');break}
  case 'steps':openSteps();break;
  case 'stepsSave':{const n=num($('#stepsIn').value);if(n!=null){day(ds.k).passos=Math.round(n);save()}closeModal();render();break}
  case 'foodAdd':{const n=$('#fn').value.trim(),k=num($('#fk').value),p=num($('#fp').value);if(!n||k==null){toast('PREENCHA NOME E KCAL');break}day().foods.push({n,k:Math.round(k),p:Math.round(p||0)});save();render();break}
  case 'measure':measureModal();break;
  case 'measureSave':{const d=$('#md').value||today();const m={d,peso:num($('#mp').value),cintura:num($('#mc').value),peito:num($('#mpe').value),braco:num($('#mb').value)};if(!m.peso&&!m.cintura){toast('PREENCHA PESO OU CINTURA');break}S.measures=S.measures.filter(x=>x.d!==d);S.measures.push(m);save();closeModal();render();toast('MEDIDAS SALVAS');break}
  case 'photoAdd':photoModal();break;
  case 'photoSave':{const d=$('#pd').value||today();let n=0;for(const p of ['frente','lado','costas','biceps']){const f=$('#ph-'+p).files[0];if(f){try{const src=await compress(f);await IDB.put({id:d+'-'+p+'-'+Date.now(),d,pose:p,src});n++;save()}catch(err){}}}closeModal();toast(n?n+' FOTO(S) SALVA(S)':'NENHUMA FOTO ESCOLHIDA');render();break}
  case 'medSave':{const d=$('#ad').value||today();S.meds=S.meds.filter(m=>m.d!==d);S.meds.push({d,dose:$('#ado').value,local:$('#al').value,nausea:+$('#an').dataset.val,intestino:+$('#ai').dataset.val,energia:+$('#ae').dataset.val,obs:$('#ao').value});S.profile.dose=$('#ado').value||S.profile.dose;save();closeModal();render();toast('APLICAÇÃO REGISTRADA');break}
  case 'profileSave':{const p=S.profile;p.altura=num($('#pa').value)||p.altura;p.peso=num($('#pp').value)||p.peso;p.cintura=num($('#pc').value)||p.cintura;p.hora=$('#ph').value||p.hora;p.medDia=+$('#pmd').value;p.dose=$('#pdo').value||p.dose;p.doseConfirmada=$('#pdc').checked;
   const mk=num($('#mk').value),mpr=num($('#mpr').value),mag=num($('#mag').value),mca=num($('#mca').value);
   p.metaKcal=mk?Math.round(mk):null;p.metaProt=mpr?Math.round(mpr):null;p.metaAgua=mag?Math.round(mag*1000):null;p.metaCardio=mca?Math.round(mca):null;save();render();toast('DADOS SALVOS');break}
  case 'export':exportModal();break;
  case 'copyExp':{const ta=$('#exp');try{await navigator.clipboard.writeText(ta.value);toast('COPIADO')}catch(err){ta.select();toast('TEXTO SELECIONADO, COPIE')}break}
  case 'import':importModal();break;
  case 'impSave':{let txt=$('#imp').value.trim();const f=$('#impf').files[0];if(f)txt=await f.text();try{const o=JSON.parse(txt);const st=o.state||o;if(!st.profile)throw 0;S=Object.assign(blank(),st);if(o.photos)for(const p of o.photos)await IDB.put(p);save();closeModal();go('home');toast('DADOS IMPORTADOS')}catch(err){toast('BACKUP INVÁLIDO')}break}
  case 'reset':{if(t.dataset.confirm){try{localStorage.removeItem(KEY)}catch(err){}const ph=await IDB.all();for(const p of ph)await IDB.del(p.id);S=blank();go('home')}else{t.dataset.confirm=1;t.textContent='Toque de novo para APAGAR TUDO (não tem volta)';t.style.color='var(--bad)'}break}
  case 'obSave':{const a=num($('#oa').value),p=num($('#op').value),c=num($('#oc').value);if(!a||!p||!c){$('#oerr').hidden=false;break}
   S.profile={altura:a,peso:p,cintura:c,hora:$('#oh').value||'06:30',medDia:+$('#omd').value,dose:$('#odo').value||'5 mg',start:$('#os').value||today()};
   S.measures.push({d:S.profile.start,peso:p,cintura:c});save();
   if(INITIAL_PHOTOS.length){const ex=await IDB.all();if(!ex.some(x=>x.d==='2026-11-02'))for(const ph of INITIAL_PHOTOS)await IDB.put(ph)}
   closeModal();render();toast('JORNADA INICIADA. BORA, MONSTRO!');break}
 }
});
document.addEventListener('input',e=>{if(e.target.id==='libq'){libQ=e.target.value;const pos=e.target.selectionStart;render();const el=$('#libq');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}return}const ds=e.target.dataset;if(ds.set&&S.session){const[ex,j,f]=ds.set.split('|');S.session.sets[ex][+j][f]=e.target.value;save()}});
document.addEventListener('change',async e=>{
 if(e.target.id==='gup'&&e.target.files[0]){await uploadGuide(e.target.files[0]);return}
 if(e.target.id==='fsel'){forcaEx=e.target.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.profile&&!$('#modal').hidden)closeModal()});

(async()=>{await IDB.open();try{const all=await IDB.all();photoDates=new Set(all.map(p=>p.d))}catch(e){}
 try{guideReady=!!(await IDB.getG())}catch(e){}
 if(S.session&&S.session.d===today())view='sessao';
 if(sb){try{const {data}=await sb.auth.getSession();user=data&&data.session?data.session.user:null}catch(e){}}
 setSync(user?'pend':'local');render();
 if(user){syncNow()}
 if(sb)sb.auth.onAuthStateChange((ev,session)=>{user=session?session.user:null;if(ev==='SIGNED_OUT')setSync('local')});
 window.addEventListener('online',()=>user&&syncNow());window.addEventListener('offline',()=>setSync('offline'));
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user)syncNow()});
 setInterval(()=>{if(user&&document.visibilityState==='visible')syncNow()},120000);
 if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
 try{if('wakeLock' in navigator)document.addEventListener('click',()=>{if(view==='sessao'||cardioRun)navigator.wakeLock.request('screen').catch(()=>{})},{once:false})}catch(e){}
})();
</script>
